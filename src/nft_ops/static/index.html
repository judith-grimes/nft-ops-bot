<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NFT Ops</title>
  <link rel="icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="lock" class="lock hidden">
    <form id="lock-form" class="lock-card">
      <img src="/static/icon.svg" alt="" width="44" height="44">
      <h1>NFT Ops</h1>
      <p id="lock-text" class="muted"></p>
      <input id="lock-password" type="password" autocomplete="current-password" placeholder="Vault password" required>
      <input id="lock-password2" type="password" autocomplete="new-password" placeholder="Repeat password" class="hidden">
      <button class="primary" type="submit" id="lock-button">Unlock</button>
      <p id="lock-error" class="error"></p>
      <p class="tiny muted">Runs only on this computer. Keys are encrypted with your password and never leave this machine.</p>
    </form>
  </div>

  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand"><img src="/static/icon.svg" alt="" width="26" height="26"><span>NFT Ops</span></div>
      <nav id="nav">
        <a data-page="overview">Overview</a>
        <a data-page="wallets">Wallets</a>
        <a data-page="collections">Collections</a>
        <a data-page="eligibility">Eligibility</a>
        <a data-page="mint">Mint</a>
        <a data-page="transfers">Transfers</a>
        <a data-page="contracts">Contracts</a>
        <a data-page="history">History</a>
        <a data-page="networks">Networks</a>
        <a data-page="settings">Settings</a>
      </nav>
      <div class="top-actions">
        <button id="bell" class="ghost bell" title="Alerts">🔔<span id="bell-count" class="count hidden">0</span></button>
        <span id="live" class="live" title="Live updates">●</span>
        <button id="stop-button" class="stop">STOP</button>
      </div>
    </header>
    <div id="stopped-banner" class="banner hidden">
      Emergency STOP is active — no new transactions will be sent.
      <button id="resume-button" class="ghost">Resume…</button>
    </div>
    <main id="main"></main>
  </div>

  <div id="modal" class="modal hidden"><div class="modal-card" id="modal-card"></div></div>
  <div id="toast" class="toast hidden"></div>
</body>
</html>
